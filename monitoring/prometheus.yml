global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: qpm-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8081]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
