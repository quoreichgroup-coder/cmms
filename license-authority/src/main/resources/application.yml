server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: quoreich-license-authority
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quoreich_licenses}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
license-authority:
  admin-token: ${LICENSE_ADMIN_TOKEN}
  private-key-path: ${LICENSE_PRIVATE_KEY_PATH:/run/secrets/license-private.pem}
  lease-days: 30
management:
  endpoints:
    web:
      exposure:
        include: health
